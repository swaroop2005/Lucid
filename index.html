<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#eaf0f7"/><title>Lucid · Support workspace</title><style>html{background:#eaf0f7}html[data-theme="dark"]{background:#0e1928}</style><script>try{const preference=localStorage.getItem('lucid-theme');const dark=preference==='dark'||(preference!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#0e1928':'#eaf0f7';}catch{}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
